name: LiveSync Windows PCM verification

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Native build run in this fork containing the Windows x64 artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: livesync-pcm-verify-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  wait-for-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait for the selected native build to complete
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          gh run watch "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60

  verify:
    needs: wait-for-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the completed build from this fork
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: livesync-mpv-windows-x64-*
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: build/livesync/archive
      - name: Extract native dependency
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build/livesync/archive -Filter *.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one native archive' }
          Expand-Archive $archives[0].FullName build/livesync/mpv
      - name: Verify native PCM with exact synthetic media timestamps
        shell: bash
        env:
          NATIVE_RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 scripts/livesync/stage_windows_runtime.py --output build/livesync/mpv
          mkdir -p build/livesync/evidence
          cp build/livesync/mpv/livesync-runtime-provenance.json build/livesync/evidence/
          python3 scripts/livesync/probe_pcm.py --library build/livesync/mpv/libmpv-2.dll --output build/livesync/evidence/pcm
          python3 scripts/livesync/probe_subtitles.py --library build/livesync/mpv/libmpv-2.dll --output build/livesync/evidence/subtitles
          printf '%s\n' "$NATIVE_RUN_ID" > build/livesync/evidence/native-build-run.txt
          git rev-parse HEAD > build/livesync/evidence/probe-source-sha.txt
      - name: Verify native polling and player shutdown
        shell: pwsh
        run: |
          $include = (Resolve-Path build/livesync/mpv/include).Path
          cmake -S native/live_subtitle_sync -B build/livesync/capture-owner "-DLIVESYNC_MPV_INCLUDE=$include"
          if ($LASTEXITCODE -ne 0) { throw 'Capture worker configuration failed' }
          cmake --build build/livesync/capture-owner --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Capture worker build failed' }
          ctest --test-dir build/livesync/capture-owner -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'PCM contracts failed' }
          python scripts/livesync/probe_capture_owner.py --library build/livesync/mpv/libmpv-2.dll --capture build/livesync/capture-owner/Release/livesync_capture_bridge.dll --output build/livesync/evidence/capture-owner
          if ($LASTEXITCODE -ne 0) { throw 'Capture ownership or shutdown verification failed' }
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: livesync-windows-pcm-${{ github.run_id }}
          path: build/livesync/evidence/
          if-no-files-found: error
          retention-days: 14
