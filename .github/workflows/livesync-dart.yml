name: LiveSync Dart components

on:
  workflow_dispatch:
  push:
    branches: [feature/live-subtitle-sync]
    paths:
      - '.github/workflows/livesync-dart.yml'
      - 'lib/features/live_subtitle_sync/**'
      - 'test/features/live_subtitle_sync/**'
      - 'docs/live-subtitle-sync-versions.json'
      - 'scripts/livesync/create_analysis_fixture.py'
      - 'scripts/livesync/test_analysis_fixture.py'
      - 'scripts/livesync/create_speech_fixture.py'
      - 'scripts/livesync/test_speech_fixture.py'
      - 'test/fixtures/livesync/librispeech-development.json'

permissions:
  contents: read

concurrency:
  group: livesync-dart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  components:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup the selected upstream Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Verify the SDK and resolve locked dependencies
        shell: bash
        run: |
          mkdir -p build/livesync/evidence
          # First Windows invocation may print SDK bootstrap output before JSON.
          flutter --version
          flutter --version --machine > build/livesync/evidence/flutter-version.json
          python3 -c 'import json; actual=json.load(open("build/livesync/evidence/flutter-version.json")); expected=json.load(open("docs/live-subtitle-sync-versions.json"))["flutter"]; assert actual["frameworkRevision"] == expected["revision"]; assert actual["engineRevision"] == expected["engine"]'
          flutter pub get --enforce-lockfile --no-example
          git rev-parse HEAD > build/livesync/evidence/fork-sha.txt
      - name: Verify fixture timing transforms
        shell: bash
        run: python3 -m unittest discover -s scripts/livesync -p 'test_*fixture.py' > build/livesync/evidence/fixture-tests.txt 2>&1
      - name: Analyze and test the feature components
        shell: bash
        run: |
          flutter analyze --no-pub lib/features/live_subtitle_sync test/features/live_subtitle_sync
          flutter test --no-pub --machine test/features/live_subtitle_sync > build/livesync/evidence/dart-tests.jsonl
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: livesync-dart-${{ matrix.runner }}-${{ github.sha }}
          path: build/livesync/evidence/
          if-no-files-found: error
          retention-days: 14
