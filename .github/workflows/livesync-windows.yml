name: LiveSync Windows application

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Native build run in this fork containing the Windows x64 artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: livesync-windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-native:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait for the selected native build
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          gh run watch "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60

  app:
    needs: wait-for-native
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Stage the patched native package with checked build provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.run_id }}
        run: |
          python scripts/livesync/stage_windows_package.py --run-id $env:NATIVE_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Native package verification failed' }
          New-Item -ItemType Directory -Force build/livesync/evidence | Out-Null
          Copy-Item windows/LiveSyncMPV/livesync-provenance.json build/livesync/evidence/
          Copy-Item docs/live-subtitle-sync-versions.json build/livesync/evidence/versions.json
          git rev-parse HEAD > build/livesync/evidence/fork-sha.txt
      - name: Setup the exact upstream Flutter SDK
        uses: ./.github/actions/setup-flutter-git
      - name: Resolve locked dependencies and install the upstream DComp engine
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile --no-example
          if ($LASTEXITCODE -ne 0) { throw 'Pub failed' }
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter precache failed' }
          ./windows/tool/install-patched-engine.ps1
          flutter --version --machine > build/livesync/evidence/flutter-version.json
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber,CsProcessors |
            ConvertTo-Json -Depth 4 > build/livesync/evidence/runner.json
      - name: Build the isolated test application
        shell: pwsh
        run: |
          flutter build windows --debug --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Windows application build failed' }
      - name: Build and execute upstream native reliability contracts
        shell: pwsh
        run: |
          $buildDir = 'build/windows/x64'
          cmake -S windows -B $buildDir -DPLEZY_BUILD_MPV_PROPERTY_CONTRACT_TESTS=ON -DPLEZY_BUILD_DISPLAY_RECOVERY_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Native test configure failed' }
          cmake --build $buildDir --config Debug --parallel 2 --target mpv_property_result_contract_test mpv_player_property_contract_test display_mode_manager_test
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed' }
          $bundle = (Resolve-Path "$buildDir/runner/Debug").Path
          $env:PATH = "$bundle;$env:PATH"
          ctest --test-dir "$buildDir/runner" -C Debug --output-on-failure --no-tests=error --output-junit "${{ github.workspace }}/build/livesync/evidence/native-contracts.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Native contracts failed' }
      - name: Verify PCM and reversible SRT timing with the app-bundled DLL
        shell: pwsh
        run: |
          $dll = 'build/windows/x64/runner/Debug/libmpv-2.dll'
          if ((Get-FileHash $dll).Hash -ne (Get-FileHash windows/LiveSyncMPV/libmpv-2.dll).Hash) {
            throw 'App did not bundle the staged library'
          }
          python scripts/livesync/probe_pcm.py --library $dll --output build/livesync/evidence/pcm
          if ($LASTEXITCODE -ne 0) { throw 'PCM verification failed' }
          python scripts/livesync/probe_subtitles.py --library $dll --output build/livesync/evidence/subtitles
          if ($LASTEXITCODE -ne 0) { throw 'SRT timing verification failed' }
      - name: Verify native PCM conversion with the app-bundled DLL
        shell: pwsh
        run: |
          cmake -S native/live_subtitle_sync -B build/livesync/pcm-consumer
          if ($LASTEXITCODE -ne 0) { throw 'PCM consumer configure failed' }
          cmake --build build/livesync/pcm-consumer --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'PCM consumer build failed' }
          ctest --test-dir build/livesync/pcm-consumer -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'PCM consumer tests failed' }
          python scripts/livesync/probe_pcm_consumer.py --library build/windows/x64/runner/Debug/libmpv-2.dll --consumer build/livesync/pcm-consumer/Release/livesync_pcm_bridge.dll --output build/livesync/evidence/consumer
          if ($LASTEXITCODE -ne 0) { throw 'Native PCM conversion probe failed' }
      - name: Verify actual CPU inference from active-playback PCM
        shell: pwsh
        run: |
          python scripts/livesync/prepare_native.py whisper --dest build/livesync/whisper-source
          if ($LASTEXITCODE -ne 0) { throw 'Whisper source preparation failed' }
          python scripts/livesync/prepare_native.py models --dest build/livesync/models
          if ($LASTEXITCODE -ne 0) { throw 'Model verification failed' }
          cmake -S build/livesync/whisper-source -B build/livesync/whisper -DGGML_METAL=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Whisper configure failed' }
          cmake --build build/livesync/whisper --config Release --parallel 3 --target whisper-cli
          if ($LASTEXITCODE -ne 0) { throw 'Whisper build failed' }
          cmake -S native/live_subtitle_sync -B build/livesync/pcm-consumer -DGGML_METAL=OFF "-DLIVESYNC_WHISPER_SOURCE=$env:GITHUB_WORKSPACE/build/livesync/whisper-source"
          if ($LASTEXITCODE -ne 0) { throw 'Native worker configure failed' }
          cmake --build build/livesync/pcm-consumer --config Release --parallel 3 --target livesync_inference_bridge
          if ($LASTEXITCODE -ne 0) { throw 'Native worker build failed' }
          foreach ($model in @('base.en', 'base.en-q5_1')) {
            python scripts/livesync/probe_inference_pipeline.py --library build/windows/x64/runner/Debug/libmpv-2.dll --consumer build/livesync/pcm-consumer/Release/livesync_pcm_bridge.dll --fixture build/livesync/whisper-source/samples/jfk.wav --whisper-cli build/livesync/whisper/bin/Release/whisper-cli.exe --model "build/livesync/models/ggml-$model.bin" --output "build/livesync/evidence/pipeline-$model.json"
            if ($LASTEXITCODE -ne 0) { throw 'Active-playback inference probe failed' }
            python scripts/livesync/probe_inference_worker.py --worker build/livesync/pcm-consumer/Release/livesync_inference_bridge.dll --model "build/livesync/models/ggml-$model.bin" --fixture build/livesync/whisper-source/samples/jfk.wav --library build/windows/x64/runner/Debug/libmpv-2.dll --consumer build/livesync/pcm-consumer/Release/livesync_pcm_bridge.dll --output "build/livesync/evidence/worker-active-$model.json"
            if ($LASTEXITCODE -ne 0) { throw 'Active-playback worker probe failed' }
          }
      - name: Preserve test application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: livesync-windows-app-${{ github.sha }}
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 14
      - name: Build and capture the dedicated native renderer harness
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Fixture generator installation failed' }
          }
          python scripts/livesync/create_renderer_fixture.py --output build/livesync/renderer-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Renderer fixture generation failed' }
          $fixture = (Resolve-Path build/livesync/renderer-fixture).Path
          New-Item -ItemType Directory -Force build/livesync/evidence/renderer | Out-Null
          $evidence = (Resolve-Path build/livesync/evidence/renderer).Path
          ffmpeg -version > build/livesync/evidence/renderer/fixture-generator.txt
          flutter build windows --debug --no-pub --target tool/livesync_player_probe.dart "--dart-define=LIVESYNC_FIXTURE_DIR=$fixture" "--dart-define=LIVESYNC_RENDERER_AUTOMATION_DIR=$evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Dedicated renderer build failed' }
          ./scripts/livesync/capture_windows_renderer.ps1 -Executable build/windows/x64/runner/Debug/plezy_livesync.exe -OutputDirectory $evidence
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: livesync-windows-contracts-${{ github.sha }}
          path: build/livesync/evidence/
          if-no-files-found: error
          retention-days: 14
