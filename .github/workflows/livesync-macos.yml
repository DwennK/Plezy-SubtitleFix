name: LiveSync macOS app and native contracts

run-name: ${{ inputs.integration_id && format('LiveSync upstream {0}', inputs.integration_id) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Flutter application configuration
        type: choice
        options: [debug, release]
        default: debug
      integration_id:
        description: Exact candidate SHA supplied by upstream integration
        type: string
        default: ""
  push:
    branches: [feature/live-subtitle-sync]
    paths:
      - '.github/workflows/livesync-macos.yml'
      - 'scripts/livesync/stage_macos_package.py'
      - 'native/live_subtitle_sync/patches/**'
      - 'macos/RunnerTests/**'
      - 'macos/Runner.xcodeproj/**'

permissions:
  contents: read

concurrency:
  group: livesync-macos-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      FLUTTER_BUILD_MODE: ${{ inputs.build_mode || 'debug' }}
      BUILD_CONFIGURATION: ${{ inputs.build_mode == 'release' && 'Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup upstream Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Record and validate the selected build configuration
        run: |
          case "$FLUTTER_BUILD_MODE" in debug|release) ;; *) exit 1 ;; esac
          mkdir -p build/livesync/evidence
          python3 - <<'PYMODE'
          import json, os
          from pathlib import Path
          Path('build/livesync/evidence/build-mode.json').write_text(json.dumps({
              'flutterMode': os.environ['FLUTTER_BUILD_MODE'],
              'nativeConfiguration': os.environ['BUILD_CONFIGURATION'],
              'contractTestabilityOverride': True,
              'artifactPreservedBeforeContractRebuild': True,
          }, indent=2) + '\n')
          PYMODE
      - name: Prepare and build the patched native dependency
        run: |
          brew install autoconf automake libtool ninja
          python3 scripts/livesync/prepare_native.py mpv-build --dest build/livesync/mpv-source
          make -C build/livesync/mpv-source build use-prebuilt libs=libmpv platform=macos
      - name: Stage the macOS-only package and provenance
        run: |
          archive=build/livesync/mpv-source/dist/release/Libmpv.xcframework.zip
          checksum=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          python3 scripts/livesync/stage_macos_package.py --source build/livesync/mpv-source --archive "$archive" --sha256 "$checksum"
          mkdir -p build/livesync/evidence
          cp macos/LiveSyncMPV/livesync-provenance.json build/livesync/evidence/
          cp docs/live-subtitle-sync-versions.json build/livesync/evidence/versions.json
          git rev-parse HEAD > build/livesync/evidence/fork-sha.txt
          xcodebuild -version > build/livesync/evidence/xcode-version.txt
          xcrun clang --version > build/livesync/evidence/clang-version.txt
          swift --version > build/livesync/evidence/swift-version.txt
          flutter --version --machine > build/livesync/evidence/flutter-version.json
          uname -a > build/livesync/evidence/runner.txt
      - name: Resolve app dependencies
        run: |
          flutter pub get --enforce-lockfile --no-example
          cd packages/wakelock_plus
          flutter pub get --enforce-lockfile --no-example
      - name: Build the isolated test application
        run: |
          python3 scripts/livesync/build_analysis_runtime.py --target macos-arm64
          flutter build macos "--$FLUTTER_BUILD_MODE" --no-pub
      - name: Package the test application before contract instrumentation
        run: |
          bundle="build/macos/Build/Products/$BUILD_CONFIGURATION/PlezyLiveSync.app"
          codesign --verify --deep --strict "$bundle"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" build/livesync/PlezyLiveSync-macos-test.zip
      - name: Preserve test application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: livesync-macos-app-${{ github.sha }}${{ inputs.build_mode == 'release' && '-release' || '' }}
          path: build/livesync/PlezyLiveSync-macos-test.zip
          if-no-files-found: error
          retention-days: 14
      - name: Test the actual app-linked native library
        run: |
          # XCTest imports internal Swift symbols. Preserve the ordinary app
          # first; the contract rebuild enables testability in the chosen mode.
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -configuration "$BUILD_CONFIGURATION" ENABLE_TESTABILITY=YES -destination 'platform=macOS,arch=arm64' -derivedDataPath build/macos -clonedSourcePackagesDirPath build/macos/SourcePackages -only-testing:RunnerTests -resultBundlePath build/livesync/evidence/native-contracts.xcresult
          xcrun xcresulttool get test-results summary --path build/livesync/evidence/native-contracts.xcresult --format json > build/livesync/evidence/native-contracts.json
          python3 scripts/checks/check_apple_spm_locks.py
      - name: Verify actual automatic correction in the Mac production controller
        run: |
          brew install ffmpeg
          python3 -m unittest discover -s scripts/livesync -p test_macos_controller_runner.py
          python3 scripts/livesync/prepare_native.py models --dest build/livesync/models
          mkdir -p build/livesync/calibration-player
          fixture="$GITHUB_WORKSPACE/build/livesync/calibration-player"
          # The ordinary app has already been archived. This distinct entrypoint
          # exercises real PCM/Whisper and the production controller, with null
          # audio output. It neither installs the app nor proves audible playback.
          flutter build macos "--$FLUTTER_BUILD_MODE" --no-pub --target tool/livesync_analysis_player_probe.dart "--dart-define=LIVESYNC_ANALYSIS_FIXTURE_DIR=$fixture" --dart-define=LIVESYNC_SEED_WRONG_GAP=true
          bundle="build/macos/Build/Products/$BUILD_CONFIGURATION/PlezyLiveSync.app"
          codesign --verify --deep --strict "$bundle"
          for case in calibration intro-90; do
            python3 scripts/livesync/create_analysis_fixture.py --source build/livesync/corpus-source --output "$fixture" --model build/livesync/models/ggml-base.en-q5_1.bin --channels 6 --case "$case"
            limit=150
            if [ "$case" = intro-90 ]; then limit=240; fi
            python3 scripts/livesync/run_macos_controller.py --bundle "$bundle" --fixture "$fixture" --evidence build/livesync/evidence --mode "$FLUTTER_BUILD_MODE" --timeout "$limit"
          done
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: livesync-macos-contracts-${{ github.sha }}${{ inputs.build_mode == 'release' && '-release' || '' }}
          path: build/livesync/evidence/
          if-no-files-found: error
          retention-days: 14
