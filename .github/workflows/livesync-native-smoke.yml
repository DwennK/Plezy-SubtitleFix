name: LiveSync native inference smoke

on:
  workflow_dispatch:
  push:
    branches: [feature/live-subtitle-sync]
    paths:
      - '.github/workflows/livesync-native-smoke.yml'
      - 'scripts/livesync/**'
      - 'native/live_subtitle_sync/**'
      - 'docs/live-subtitle-sync-versions.json'

permissions:
  contents: read

concurrency:
  group: livesync-native-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inference:
    name: Inference ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            metal: 'OFF'
          - platform: macos-arm64
            runner: macos-26
            metal: 'ON'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare pinned source and verified models
        shell: bash
        run: |
          python3 scripts/livesync/prepare_native.py whisper --dest build/livesync/source
          python3 scripts/livesync/prepare_native.py models --dest build/livesync/models
          python3 scripts/livesync/prepare_speech_model.py --dest build/livesync/models
      - name: Build and test the bounded PCM consumer
        shell: bash
        run: |
          cmake -S native/live_subtitle_sync -B build/livesync/pcm-consumer -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=OFF -DLIVESYNC_WHISPER_SOURCE="$GITHUB_WORKSPACE/build/livesync/source" -DLIVESYNC_SPEECH_MODEL="$GITHUB_WORKSPACE/build/livesync/models/ggml-silero-v6.2.0.bin" -DLIVESYNC_VAD_TEST_MODEL="$GITHUB_WORKSPACE/build/livesync/models/ggml-silero-v6.2.0.bin"
          cmake --build build/livesync/pcm-consumer --config Release --parallel 3
          mkdir -p build/livesync/evidence
          ctest --test-dir build/livesync/pcm-consumer -C Release --output-on-failure --output-junit "$GITHUB_WORKSPACE/build/livesync/evidence/pcm-consumer.xml"
      - name: Verify asynchronous CPU inference and stale-generation rejection
        shell: bash
        run: |
          python3 scripts/livesync/prepare_inference_fixture.py --fixture build/livesync/source/samples/jfk.wav --output build/livesync/fixtures/jfk.f32
          exe=build/livesync/pcm-consumer/livesync_inference_test
          bridge=build/livesync/pcm-consumer/liblivesync_inference_bridge.dylib
          if [[ "$RUNNER_OS" == Windows ]]; then exe=build/livesync/pcm-consumer/Release/livesync_inference_test.exe; fi
          if [[ "$RUNNER_OS" == Windows ]]; then bridge=build/livesync/pcm-consumer/Release/livesync_inference_bridge.dll; fi
          for model in base.en base.en-q5_1; do
            "$exe" "build/livesync/models/ggml-$model.bin" build/livesync/fixtures/jfk.f32 > "build/livesync/evidence/worker-$model.txt" 2>&1
            python3 scripts/livesync/probe_inference_worker.py --require-speech-support --worker "$bridge" --model "build/livesync/models/ggml-$model.bin" --fixture build/livesync/source/samples/jfk.wav --output "build/livesync/evidence/worker-abi-$model.json"
          done
      - name: Verify bounded speech detector and fresh state between windows
        shell: bash
        run: |
          exe=build/livesync/pcm-consumer/livesync_speech_support_test
          if [[ "$RUNNER_OS" == Windows ]]; then exe=build/livesync/pcm-consumer/Release/livesync_speech_support_test.exe; fi
          "$exe" build/livesync/models/ggml-silero-v6.2.0.bin build/livesync/fixtures/jfk.f32 > build/livesync/evidence/speech-support.txt 2>&1
          python3 - <<'PYVAD'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('build/livesync/evidence/speech-support.txt').read_text().splitlines() if line.startswith('{')]
          assert len(rows) == 1 and rows[0]['intervals'] and rows[0]['resetAndReusePassed']
          PYVAD
      - name: Verify bounded CPU recovery after injected backend failures
        shell: bash
        run: |
          exe=build/livesync/pcm-consumer/livesync_inference_fallback_test
          if [[ "$RUNNER_OS" == Windows ]]; then exe=build/livesync/pcm-consumer/Release/livesync_inference_fallback_test.exe; fi
          python3 scripts/livesync/test_inference_fallback.py --executable "$exe" --model build/livesync/models/ggml-base.en-q5_1.bin --fixture build/livesync/source/samples/jfk.wav --output build/livesync/evidence/inference-fallback.json
      - name: Check Windows CPU evaluation capabilities
        if: runner.os == 'Windows'
        id: cpu-capabilities
        shell: pwsh
        run: |
          $features = [System.Runtime.Intrinsics.X86.X86Base]::CpuId(1, 0)
          $supported = [System.Runtime.Intrinsics.X86.Avx2]::IsSupported -and
            [System.Runtime.Intrinsics.X86.Sse42]::IsSupported -and
            [System.Runtime.Intrinsics.X86.Bmi2]::IsSupported -and
            [System.Runtime.Intrinsics.X86.Fma]::IsSupported -and
            (($features.Item3 -band (1 -shl 29)) -ne 0)
          "supported=$($supported.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          @{
            avx2EvaluationSupported = $supported
            processors = @(Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors)
            physicalMemoryBytes = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          } | ConvertTo-Json -Depth 5 > build/livesync/evidence/worker-cpu-host.json
      - name: Compare the guarded AVX2 worker with the portable CPU worker
        if: runner.os == 'Windows' && steps.cpu-capabilities.outputs.supported == 'true'
        shell: bash
        run: |
          cmake -S native/live_subtitle_sync -B build/livesync/worker-avx2 -DGGML_METAL=OFF -DLIVESYNC_CPU_PROFILE=avx2-evaluation -DLIVESYNC_WHISPER_SOURCE="$GITHUB_WORKSPACE/build/livesync/source" -DLIVESYNC_SPEECH_MODEL="$GITHUB_WORKSPACE/build/livesync/models/ggml-silero-v6.2.0.bin"
          cmake --build build/livesync/worker-avx2 --config Release --parallel 3 --target livesync_inference_bridge
          for model in base.en base.en-q5_1; do
            python3 scripts/livesync/probe_inference_worker.py --require-speech-support --worker build/livesync/worker-avx2/Release/livesync_inference_bridge.dll --model "build/livesync/models/ggml-$model.bin" --fixture build/livesync/source/samples/jfk.wav --output "build/livesync/evidence/worker-avx2-$model.json"
            python3 scripts/livesync/probe_inference_worker.py --threads 2 --require-speech-support --worker build/livesync/worker-avx2/Release/livesync_inference_bridge.dll --model "build/livesync/models/ggml-$model.bin" --fixture build/livesync/source/samples/jfk.wav --output "build/livesync/evidence/worker-avx2-2threads-$model.json"
          done
      - name: Compile native inference
        shell: bash
        run: |
          cmake -S build/livesync/source -B build/livesync/native -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=${{ matrix.metal }} -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build build/livesync/native --config Release --parallel 3 --target whisper-cli
      - name: Run real CPU inference with both models
        shell: bash
        run: |
          mkdir -p build/livesync/evidence
          exe=build/livesync/native/bin/whisper-cli
          if [[ "$RUNNER_OS" == Windows ]]; then exe=build/livesync/native/bin/Release/whisper-cli.exe; fi
          for model in base.en base.en-q5_1; do
            "$exe" -ng -m "build/livesync/models/ggml-$model.bin" -f build/livesync/source/samples/jfk.wav -ojf -of "build/livesync/evidence/$model-cpu" > "build/livesync/evidence/$model-cpu.txt" 2>&1
          done
          python3 scripts/livesync/check_inference.py --fixture build/livesync/source/samples/jfk.wav --evidence build/livesync/evidence
          cp docs/live-subtitle-sync-versions.json build/livesync/evidence/versions.json
          git rev-parse HEAD > build/livesync/evidence/fork-sha.txt
          cmake --version > build/livesync/evidence/cmake-version.txt
          uname -a > build/livesync/evidence/runner.txt
      - name: Preserve native test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: livesync-inference-${{ matrix.platform }}-${{ github.sha }}
          path: build/livesync/evidence/
          if-no-files-found: error
          retention-days: 14
